name: Mobile iOS Release

# Why a separate workflow from Android: iOS releases go through App Store
# review, which can take days. Decoupling the triggers lets an Android release
# ship immediately without waiting on iOS, and vice versa.
on:
  push:
    tags:
      - 'mobile-ios-v*'
  workflow_dispatch:
    inputs:
      bump_patch_version:
        description: "Bump the iOS marketing version patch number before release. Tick this after a version has shipped to the App Store (the release fails fast if the current version's train is already closed)."
        required: false
        default: false
        type: boolean
      release_version:
        description: 'Optional exact iOS marketing version override, e.g. 0.0.15'
        required: false
        type: string
      testflight_changelog:
        description: 'Optional TestFlight external tester changelog'
        required: false
        type: string

jobs:
  ios-build:
    # GitHub-hosted macOS runner: required for Xcode. Expo SDK 55's
    # expo-modules-core declares swift_version 6.0 and uses Swift 6 syntax
    # (@MainActor isolation). Xcode 16.x (macos-15) can't even parse it
    # ("unknown attribute 'MainActor'"), so we need Xcode 26.x → macos-26.
    runs-on: macos-26

    # Why: this job builds + uploads only; it never pushes to the repo, so it
    # runs on the default read-only token. The repo push lives in the separate
    # publish-manifest job, which is the only one granted contents:write.
    outputs:
      released_version: ${{ steps.released_version.outputs.version }}
      released_build_number: ${{ steps.released_version.outputs.build_number }}

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Xcode 26.x ships the Swift 6.x toolchain Expo SDK 55 requires.
          xcode-version: '26.5'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile

      - name: Resolve release version and build number
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          MOBILE_IOS_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          MOBILE_IOS_BUMP_PATCH_VERSION: ${{ github.event.inputs.bump_patch_version }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
        run: bundle exec fastlane ios prepare_release_version version:"$MOBILE_IOS_RELEASE_VERSION" bump_patch:"$MOBILE_IOS_BUMP_PATCH_VERSION"

      - name: Expo prebuild
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: npx pod-install ios

      # Why: `-allowProvisioningUpdates` + the App Store Connect API key can
      # create/refresh provisioning profiles, but it cannot recreate the
      # distribution certificate's PRIVATE KEY across runs. So we import a
      # pre-exported distribution .p12 (created once via Apple Developer) into a
      # throwaway keychain. The keychain is ephemeral to the runner and torn
      # down with the VM; nothing secret is written to the repo.
      - name: Import distribution certificate
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/orca-signing.keychain-db"
          # Random per-run keychain password; never persisted.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/orca-dist-cert.p12"

          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Allow codesign/xcodebuild to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Put our keychain in the search list so xcodebuild can find the identity.
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TESTFLIGHT_CHANGELOG: ${{ github.event.inputs.testflight_changelog }}
          # Keep fastlane non-interactive and quiet about analytics in CI.
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
        run: bundle exec fastlane ios release

      - name: Capture released version
        # Why: export the just-shipped marketing version + iOS build number
        # (fastlane wrote both into app.json during prepare) so the manifest can
        # detect TestFlight uploads that reuse the same x.y.z version.
        id: released_version
        run: |
          VERSION="$(node -e "console.log(require('./app.json').expo.version)")"
          BUILD_NUMBER="$(node -e "console.log(require('./app.json').expo.ios.buildNumber)")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: orca-mobile-ipa
          path: mobile/build/*.ipa
          if-no-files-found: ignore

  # Why: isolated into its own job so the expensive macOS build keeps the
  # default read-only token (least privilege) and only this cheap ubuntu job
  # holds contents:write. Best-effort by design: a lagging manifest must never
  # turn a successful TestFlight upload into a red run.
  publish-manifest:
    runs-on: ubuntu-latest
    needs: ios-build
    permissions:
      contents: write
    continue-on-error: true

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Bump latest-version.json
        # Why: advance mobile/latest-version.json on main so installed apps can
        # detect the new TestFlight build (iTunes Lookup only reports production
        # versions). Reads the version/build exported by the build job. Retries
        # the push once on non-fast-forward (main may advance meanwhile).
        env:
          RELEASED_VERSION: ${{ needs.ios-build.outputs.released_version }}
          RELEASED_BUILD_NUMBER: ${{ needs.ios-build.outputs.released_build_number }}
          TESTFLIGHT_CHANGELOG: ${{ github.event.inputs.testflight_changelog }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASED_VERSION" ]; then
            echo "No released_version output from ios-build; skipping."
            exit 0
          fi
          if [ -z "$RELEASED_BUILD_NUMBER" ]; then
            echo "No released_build_number output from ios-build; skipping."
            exit 0
          fi
          NOTES="${TESTFLIGHT_CHANGELOG:-Latest Orca Mobile updates and fixes.}"

          write_manifest() {
            node scripts/write-version-manifest.mjs "$RELEASED_VERSION" "$RELEASED_BUILD_NUMBER" "$NOTES"
          }

          commit_manifest() {
            if git diff --quiet -- latest-version.json; then
              echo "latest-version.json already at $RELEASED_VERSION ($RELEASED_BUILD_NUMBER); nothing to commit."
              return 1
            fi

            git add latest-version.json
            git commit -m "chore(mobile): bump latest-version manifest to $RELEASED_VERSION"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          write_manifest
          if ! commit_manifest; then
            exit 0
          fi

          if ! git push origin main; then
            # Why: another release can advance main first. Regenerate against
            # fresh main instead of rebasing the stale JSON commit, which can
            # conflict and drop the newer releaser's manifest update.
            git fetch origin main
            git checkout -B main origin/main
            write_manifest
            if ! commit_manifest; then
              exit 0
            fi
            git push origin main
          fi
